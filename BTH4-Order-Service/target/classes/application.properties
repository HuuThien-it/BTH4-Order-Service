spring.application.name=bth4-order-service
server.port=${SERVER_PORT:8082}

# Order Service has its OWN MySQL database.
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:BTH4_ORDER}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Inter-service communication is HTTP, NOT direct access to BTH3_PRODUCT.
product.service.base-url=${PRODUCT_SERVICE_URL:http://localhost:8081}
